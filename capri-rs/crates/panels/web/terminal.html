<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>CAPRI // ТЕРМИНАЛ</title>
  <link rel="stylesheet" href="app.css">
</head>
<body class="term-body">
  <div class="app term-app">
    <header class="topbar">
      <div class="brand">
        <div class="glyph" aria-hidden="true"></div>
        <div>
          <div class="brand-title">CAPRI <span class="slash">//</span> ТЕРМИНАЛ</div>
          <!-- Сюда попадает команда: как в макете, отдельной строкой. -->
          <div class="brand-sub" id="term-command">готова к работе</div>
        </div>
      </div>
      <div class="chips">
        <!-- Бейджи итога: «6 passing ✓». -->
        <span class="chip" id="term-badges">—</span>
        <span class="chip chip-green" id="chip-state">свободна</span>
        <button class="chip chip-btn" data-action="clear">Очистить</button>
      </div>
    </header>

    <main class="content term-content">
      <!-- Плашка «ЗАПУСКАЕТ» — по макету экрана 8. -->
      <div class="term-running" id="running" hidden>
        <span class="term-running-label">ЗАПУСКАЕТ</span>
        <span class="term-running-cmd" id="running-cmd"></span>
        <span class="term-spinner" aria-hidden="true"></span>
        <button class="chip chip-btn" data-action="cancel">Остановить</button>
      </div>

      <div class="term-feed" id="feed" role="log" aria-live="polite">
        <div class="term-empty" id="empty">
          <div class="term-empty-title">Терминал пуст</div>
          <div class="term-empty-hint">
            Напиши команду ниже и нажми Enter. Вывод появится по мере
            появления — ждать конца не нужно.
          </div>
        </div>
      </div>

      <div class="term-compose">
        <span class="term-prompt">PS&gt;</span>
        <input class="term-input" id="input" type="text" spellcheck="false"
               placeholder="npm test -- gigs" aria-label="Команда">
        <button class="btn btn-send" id="run" data-action="run" aria-label="Запустить">▶</button>
        <!-- Кнопка из макета: команда уходит в главный терминал системы. -->
        <button class="btn btn-main" id="to-main" data-action="to-main"
                title="Скопировать команду в буфер обмена">В main</button>
      </div>
    </main>

    <footer class="statusbar">
      <span id="status-text" class="dim">запуск…</span>
      <span class="spacer"></span>
      <span class="dim" id="term-history-hint">↑ — прошлая команда</span>
    </footer>
  </div>

  <script src="bridge.js"></script>
  <script src="terminal.js"></script>
</body>
</html>
