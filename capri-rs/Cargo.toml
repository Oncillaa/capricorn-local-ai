[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/win",
    "crates/voice",
    "crates/ui",
    "crates/app",
]

# Одна программа, никаких лишних бинарников.
default-members = ["crates/app"]

[workspace.package]
version = "2.0.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
authors = ["Капри / community port"]

[workspace.dependencies]
capri-core = { path = "crates/core" }
capri-win = { path = "crates/win" }
capri-voice = { path = "crates/voice" }
capri-ui = { path = "crates/ui" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
rand = "0.9"
strsim = "0.11"
encoding_rs = "0.8"
anyhow = "1"
thiserror = "2"
log = "0.4"
once_cell = "1"
parking_lot = "0.12"
chrono = "0.4"
libloading = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
windows = "0.62"
cpal = "0.18"
rodio = { version = "0.23", default-features = false, features = ["playback", "mp3", "wav"] }
tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots", "handshake"] }
ureq = { version = "3", features = ["json"] }
dirs = "6"
sha2 = "0.10"
base64 = "0.22"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

